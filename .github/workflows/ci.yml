# plan-hosted-early-access.md D11: the part Vercel's own Git integration does
# not do. Vercel builds `main` and every PR independently on push (and its own
# build is what proves `next build` succeeds) — this workflow's whole job is
# running the tests nothing else runs. Free on a public repo
# (pasilvadev/sl-fake-bets), so this adds no vendor and no cost.
name: CI

# `push` is narrowed to `main` on purpose: with a bare `push:` every commit on
# a PR branch runs this workflow TWICE (once for the push, once for the PR's
# synchronize event) for identical results. `main` is where work lands here
# (there are no long-lived branches), and `pull_request` covers everything that
# arrives any other way.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
