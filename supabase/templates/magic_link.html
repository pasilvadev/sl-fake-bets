<!--
  Email sign-in template — SL Fake Bets.

  This file is the whole reason email login is an OTP CODE rather than a magic
  link (decision §4.1 on the open ARC-006 question). GoTrue sends this template
  for signInWithOtp; a default template renders {{ .ConfirmationURL }} and the
  user gets a link. Rendering {{ .Token }} instead is what turns the same flow
  into a 6-digit code.

  Why the code wins here (UX-001/UX-029, onboarding friction is a product
  pillar): a magic link opened on a different device or browser than the one
  that asked for it lands in a session that cannot continue, which is exactly
  what happens when someone requests the link on a laptop and taps it in their
  phone's mail app. A code is retyped wherever the user already is.

  BILINGUAL since UX-027 (plan-i18n-ptbr.md Phase 3, task 8) — and this
  paragraph replaces the "copy stays English-only (UX-026)" line that used to
  sit here, because this task is what falsifies it.

  Self-hosted GoTrue has exactly ONE template per email type and no per-recipient
  locale: the send happens before anyone has a session, so there is nothing to
  read a preference from, and `users.locale` may not even have a row yet. The
  alternatives are a Supabase send-email auth hook plus our own sender — real
  work, and out of this plan's scope — or four lines twice. Four lines twice
  wins, and it degrades correctly for a reader of either language.

  pt-BR first because it is the locale this phase exists for; a reader who
  wants English finds it immediately below, and the code itself sits between
  them where neither has to scroll past the other to reach it.

  Adding a THIRD locale is where this stops being free — Phase 4, item 3 says
  so, and names this file as the reason.

  Still says "SL", never spelled out (UX-021).
-->
